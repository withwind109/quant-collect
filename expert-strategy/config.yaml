# =============================================================================
# expert-strategy · 采集参数配置（敏感凭据请放 .env，不要写在这里）
# 2026-10-19 起仅保留东财实盘链路——模拟盘渠道（东财 spo_* / 雪球 / 同花顺）
# 已整体删除，任何链路都不会再爬到模拟盘数据。
# =============================================================================

http:
  min_interval: 0.8      # 同一客户端请求最小间隔（秒），防止触发频控
  timeout: 20
  proxy: ""              # 需要代理时填写，如 http://127.0.0.1:7890（或用 .env HTTP_PROXY）

# ── 东方财富（唯一数据源，仅实盘）──────────────────────────────────────────
eastmoney:
  # 登录态 Cookie（.env 的 EASTMONEY_COOKIE 会覆盖这里）。匿名也可抓 rtV1 榜单，
  # 带 Cookie 只是降低 WAF 拦截概率；rtV3 实盘调仓明细走账户中心 APP 令牌。
  cookie: ""
  rank_type: "10005"     # 实盘主榜：10005日榜 / 10000周榜 / 10001月榜 / 10003年榜 / 10004总榜
  rank_types: ["10005", "10004"]  # 多榜合并：日榜给当日收益，总榜补累计收益（rateForApp 语义跟榜走）
  # 实盘组合常驻扫描名单（rtV3 只对本账户关注的组合开放；令牌来自账户中心）。
  # 与关注列表（watchlist live 条目）合并去重后逐个拉取实盘调仓明细。
  spzh_follow:
    - expert_id: "900407488"
      name: "凡人炒股"

# ── 无头浏览器抓取后端（Playwright/Chromium 拟人化反爬）──────────────────────
# enabled=true 时优先用浏览器拟人化抓取，失败自动回退 curl_cffi。
# 首次使用需: pip install playwright && python -m playwright install chromium
# headless=false 可调试（需桌面环境）。
browser:
  enabled: true
  headless: true
  stealth: true         # 注入脚本抹除 navigator.webdriver 等自动化特征
  min_interval: 1.2     # 浏览器请求最小间隔（秒），比 curl 略大更像真人
  timeout: 30000        # 单请求超时（毫秒）

output:
  dir: "data"
  formats: ["csv", "json"]

# ── 入库（本地 SQLite，可随 git 提交; 替代原 xcq MySQL）─────────────────────
sqlite:
  enabled: true
  path: ""              # 默认 <项目根>/data/experts.db（或 .env EXPERTS_DB）
  fail_hard: false      # true=入库失败即中断爬取；false=仅告警
